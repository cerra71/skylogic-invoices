# ========================
# DATASOURCE CONFIGURATION
# ========================
# URL di connessione a PostgreSQL (porta standard 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/invoices

# Driver ufficiale di PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenziali del tuo database PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=postgres

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
# Disabilita Open Session In View: evita che l'EntityManager accumuli
# tutte le entity in sessione per l'intera request HTTP (causa OOM su file grandi)
spring.jpa.open-in-view=false
# Batch insert: raggruppa gli INSERT in blocchi per ridurre i round-trip al DB
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# ========================
# MULTIPART / FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ========================
# CONNECTION POOL (opzionale)
# ========================
spring.datasource.initialization-mode=always
spring.datasource.hikari.maximum-pool-size=2

# ========================
# PROPERTIES DEL SERVIZIO
# ========================
invoices.login.username=admin

