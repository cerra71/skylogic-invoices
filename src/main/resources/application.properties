# ========================
# DATASOURCE CONFIGURATION
# ========================
# URL di connessione a PostgreSQL (porta standard 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/invoices

# Driver ufficiale di PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenziali del tuo database PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=postgres

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ========================
# CONNECTION POOL (opzionale)
# ========================
spring.datasource.initialization-mode=always
spring.datasource.hikari.maximum-pool-size=2

# ========================
# PROPERTIES DEL SERVIZIO
# ========================
invoices.login.username=admin

