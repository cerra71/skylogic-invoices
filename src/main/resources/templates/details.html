<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{components/layout :: layout('Invoices - Loading Details', ~{::content}, ~{}, ~{} )}">

    <body>
    <th:block th:fragment="content">

        <h2 class="mb-5 text-center">
            <span class="d-inline-block px-4 py-2 border border-dark rounded fs-1">LOADING DETAILS</span>
        </h2>

        <!-- Form -->
        <form id="mainForm" th:action="@{/loadRow}" method="post" class="d-flex align-items-end gap-3 mb-2 ps-3 pe-3">
            <div>
                <label class="form-label fw-bold" for="loadingId">Loading ID</label>
                <input class="form-control" id="loadingId" type="text" name="loadingId" th:value="${loadingId}">
            </div>
            <div>
                <label class="form-label fw-bold" for="rowNumber">Row number</label>
                <input class="form-control" id="rowNumber" name="rowNumber" th:value="${rowNumber}">
            </div>

            <!-- Buttons -->
            <button type="submit" class="btn btn-danger" th:formaction="@{/checkRow}" formmethod="post" th:disabled="${checkEnabled != true}">START CHECKING ROW</button>
            <button type="submit" class="btn btn-primary" th:formaction="@{/moveRowToStaging}" formmethod="post" th:disabled="${pushBackEnabled != true}">PUSH BACK TO STAGING</button>
            <a th:href="@{/checksall(loadingId=${loadingId})}" class="btn btn-primary" th:if="${loadingId != null and !#strings.isEmpty(loadingId)}">BACK TO CSV RAW</a>

        </form>

        <!-- Risultati -->
        <div class="card mb-4 border-0" id="rowDetails" th:if="${showRowDetails == true}">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <colgroup>
                            <col style="width: 20%;">
                            <col style="width: 40%;">
                            <col style="width: 40%;">
                        </colgroup>
                        <thead class="table-primary">
                        <tr>
                            <th>FIELD NAME</th>
                            <th>FIELD VALUE</th>
                            <th>CHECK RESULT</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="field : ${fields}">
                            <th class="table-primary" th:text="${field.fieldName}"></th>
                            <td th:text="${field.fieldValue}"></td>
                            <td>
                                <span th:if="${field.passed != null and field.passed}" class="text-success fw-bold" th:text="'Passed: ' + ${field.checkFailed}"></span>
                                <span th:if="${field.passed != null and !field.passed}" class="text-danger fw-bold" th:text="'Failed: ' + ${field.checkFailed}"></span>
                            </td>
                        </tr>
                        <tr th:if="${fields == null or #lists.isEmpty(fields)}">
                            <td colspan="3" class="text-center text-muted" th:text="${errorMessage != null ? errorMessage : 'No row loaded'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </th:block>
    </body>
</html>
