<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4 px-4">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary rounded mb-4" style="padding-top: 0.75rem; padding-bottom: 0.75rem;">
            <div class="container-fluid">
                <a th:href="@{/home}" class="navbar-brand fw-semibold d-flex align-items-center gap-2 fs-3">
                    <img th:src="@{/favicon.ico}" alt="" height="50" style="width: auto;">
                    INVOICES
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                        <li class="nav-item">
                            <a th:href="@{/home}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">CSV LOADINGS</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/details}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">LOADING DETAILS</a>
                        </li>                        
                        <li class="nav-item">
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-light btn-sm w-100">LOGOUT</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <h2 class="mb-5 text-center">
            <span class="d-inline-block px-4 py-2 border border-dark rounded fs-1">LOADING DETAILS</span>
        </h2>

        <!-- Form -->
        <form th:action="@{/loadRow}" method="post" class="d-flex align-items-end gap-3 mb-2 ps-3 pe-3">
            <div>
                <label class="form-label fw-bold" for="loadingId">Loading ID</label>
                <input class="form-control" id="loadingId" type="text" name="loadingId" th:value="${loadingId}">
            </div>
            <div>
                <label class="form-label fw-bold" for="rowNumber">Row number</label>
                <input class="form-control" id="rowNumber" type="number" min="1" name="rowNumber" th:value="${rowNumber}">
            </div>
            <button type="submit" class="btn btn-primary">LOAD ROW</button>
            <button type="submit" class="btn btn-primary ms-auto" th:formaction="@{/moveRowToStaging}" disabled>PUSH BACK TO STAGING</button>
            <button type="submit" class="btn btn-primary" th:formaction="@{/checkRow}" formmethod="post">START CHECKING ROW</button>
        </form>

        <div class="card mb-4 border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <colgroup>
                            <col style="width: 20%;">
                            <col style="width: 40%;">
                            <col style="width: 40%;">
                        </colgroup>
                        <thead class="table-primary">
                        <tr>
                            <th>FIELD NAME</th>
                            <th>FIELD VALUE</th>
                            <th>CHECK RESULT</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="field : ${fields}">
                            <th class="table-primary" th:text="${field.fieldName}"></th>
                            <td th:text="${field.fieldValue}"></td>
                            <td>
                                <span th:if="${field.passed != null and field.passed}" class="text-success fw-bold">Passed</span>
                                <span th:if="${field.passed != null and !field.passed}" class="text-danger fw-bold" th:text="'Failed: ' + ${field.checkFailed}"></span>
                            </td>
                        </tr>
                        <tr th:if="${fields == null or #lists.isEmpty(fields)}">
                            <td colspan="3" class="text-center text-muted" th:text="${errorMessage != null ? errorMessage : 'No row loaded'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
