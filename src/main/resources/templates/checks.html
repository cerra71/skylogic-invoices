<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org" th:replace="~{components/layout :: layout('Invoices - Checks List',
      ~{::content}, ~{}, ~{})}">

    <body>
        <th:block th:fragment="content">

            <h2 class="text-center" style="margin-bottom: 5rem;">
                <span class="d-inline-block px-4 py-2 border border-dark rounded fs-1"> CHECKS LIST </span>
            </h2>

            <div class="card mb-4 border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle">
                            <colgroup>
                                <col style="width: 7%;">
                                <col style="width: 10%;">
                                <col style="width: 22%;">
                                <col style="width: 38%;">
                                <col style="width: 11%;">
                                <col style="width: 12%;">
                            </colgroup>

                            <thead class="table-primary">
                            <tr>
                                <th>ORDER</th>
                                <th>CONTROL ID</th>
                                <th>NAME</th>
                                <th>DESCRIPTION</th>
                                <th>FIELD</th>
                                <th>CATEGORY</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="check : ${checks}">
                                <td th:text="${check.order}"></td>

                                <td>
                                    <a th:href="@{/documentation(controlId=${check.controlId})}"
                                       th:text="${check.controlId}"
                                       class="text-decoration-none fw-semibold">
                                    </a>
                                </td>

                                <td th:text="${#strings.startsWith(check.name, 'Check ')
                                            ? #strings.substring(check.name, 6)
                                            : check.name}">
                                </td>

                                <td th:text="${check.description}"></td>
                                <td th:text="${check.field.value}"></td>
                                <td th:text="${check.category.value}"></td>
                            </tr>

                            <tr th:if="${checks == null or #lists.isEmpty(checks)}">
                                <td colspan="6" class="text-center text-muted">
                                    No check available
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </th:block>
    </body>
</html>
