<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices - Checks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4 px-4">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary rounded mb-4" style="padding-top: 0.75rem; padding-bottom: 0.75rem;">
            <div class="container-fluid">
                <a th:href="@{/home}" class="navbar-brand fw-semibold d-flex align-items-center gap-2 fs-3">
                    <img th:src="@{/favicon.ico}" alt="" height="50" style="width: auto;">
                    INVOICES
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                        <li class="nav-item">
                            <a th:href="@{/home}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">CSV LOADINGS</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/details}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">LOADING DETAILS</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/checks}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">CHECKS LIST</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/documentation}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">DOCUMENTATION</a>
                        </li>
                        <li class="nav-item">
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-light btn-sm w-100">LOGOUT</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <h2 class="text-center" style="margin-bottom: 5rem;">
            <span class="d-inline-block px-4 py-2 border border-dark rounded fs-1">CHECKS LIST</span>
        </h2>

        <div class="card mb-4 border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <colgroup>
                            <col style="width: 7%;">
                            <col style="width: 10%;">
                            <col style="width: 22%;">
                            <col style="width: 38%;">
                            <col style="width: 11%;">
                            <col style="width: 12%;">
                        </colgroup>
                        <thead class="table-primary">
                        <tr>
                            <th>ORDER</th>
                            <th>CONTROL ID</th>
                            <th>NAME</th>
                            <th>DESCRIPTION</th>
                            <th>FIELD</th>
                            <th>CATEGORY</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="check : ${checks}">
                            <td th:text="${check.order}"></td>
                            <td>
                                <a th:href="@{/documentation(controlId=${check.controlId})}"
                                   th:text="${check.controlId}"
                                   class="text-decoration-none fw-semibold"></a>
                            </td>
                            <td th:text="${#strings.startsWith(check.name, 'Check ')} ? ${#strings.substring(check.name, 6)} : ${check.name}"></td>
                            <td th:text="${check.description}"></td>
                            <td th:text="${check.field.value}"></td>
                            <td th:text="${check.category.value}"></td>
                        </tr>
                        <tr th:if="${checks == null or #lists.isEmpty(checks)}">
                            <td colspan="6" class="text-center text-muted">No check available</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
