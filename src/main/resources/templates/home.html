<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4 px-4">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary rounded mb-4" style="padding-top: 0.75rem; padding-bottom: 0.75rem;">
            <div class="container-fluid">
                <a th:href="@{/home}" class="navbar-brand fw-semibold d-flex align-items-center gap-2 fs-3">
                    <img th:src="@{/favicon.ico}" alt="" height="50" style="width: auto;">
                    INVOICES
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                        <li class="nav-item">
                            <a th:href="@{/home}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">CSV LOADINGS</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/details}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">LOADING DETAILS</a>
                        </li>                        
                        <li class="nav-item">
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-light btn-sm w-100">LOGOUT</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>            

        <h2 class="text-center" style="margin-bottom: 5rem;">
            <span class="d-inline-block px-4 py-2 border border-dark rounded fs-1">CSV LOADINGS</span>
        </h2>

        <div class="d-flex justify-content-end mb-1 pe-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newLoadingModal">NEW LOADING</button>
        </div>

        <div class="modal fade" id="newLoadingModal" tabindex="-1" aria-labelledby="newLoadingModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/loadCsv}" method="post" enctype="multipart/form-data">
                        <div class="modal-header">
                            <h5 class="modal-title" id="newLoadingModalLabel">New loading</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label" for="loadingFile">CSV File</label>
                                <input class="form-control" id="loadingFile" type="file" name="file" accept=".csv" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="loadCsvSubmitBtn">
                                <span id="loadCsvSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                <span id="loadCsvBtnLabel">Load</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="card mb-4 border-0" id="results">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-primary">
                        <tr>
                            <th>Loading ID</th>
                            <th>Reporting Year</th>
                            <th>Reporting Month</th>
                            <th>Loading time</th>
                            <th>Loaded rows</th>
                            <th>Discarded rows</th>
                        </tr>
                        </thead>
                        <tbody>
                            <tr th:each="loading : ${loadings}">
                                <td><a th:href="@{/details(loadingId=${loading.loadingId})}" th:text="${loading.loadingId}"></a></td>
                                <td th:text="${loading.reportingYear}"></td>
                                <td th:text="${loading.reportingMonth}"></td>
                                <td th:text="${loading.loadingTime}"></td>
                                <td th:text="${loading.loadedRows}"></td>
                                <td th:text="${loading.discardedRows}"></td>
                            </tr>
                            <tr th:if="${loadings == null or #lists.isEmpty(loadings)}">
                                <td colspan="6" class="text-center text-muted">No loading available</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('#newLoadingModal form').addEventListener('submit', function () {
            document.getElementById('loadCsvSpinner').classList.remove('d-none');
            document.getElementById('loadCsvBtnLabel').textContent = 'Loading...';
            document.getElementById('loadCsvSubmitBtn').disabled = true;
        });
    </script>
</body>
</html>
