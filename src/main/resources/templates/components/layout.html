<!DOCTYPE html>
    <html lang="it"
          xmlns:th="http://www.thymeleaf.org"
          th:fragment="layout(pageTitle, pageContent, pageStyles, pageScripts)">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title th:text="${pageTitle}">Invoices</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


        <!-- CSS specifico della pagina -->
        <th:block th:replace="${pageStyles}"></th:block>
    </head>

    <body>
        <div class="container-fluid py-4 px-4">

            <!-- Navbar condivisa -->
            <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary rounded mb-4" style="padding-top: 0.75rem; padding-bottom: 0.75rem;">
                <div class="container-fluid">
                    <a th:href="@{/home}" class="navbar-brand fw-semibold d-flex align-items-center gap-2 fs-3">
                        <img th:src="@{/favicon.ico}" alt="" height="50" style="width: auto;">
                        INVOICES
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                            <li class="nav-item">
                                <a th:href="@{/home}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">CSV LOADINGS</a>
                            </li>
                            <li class="nav-item">
                                <a th:href="@{/checks}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">CHECKS LIST</a>
                            </li>
                            <li class="nav-item">
                                <a th:href="@{/documentation}" class="btn btn-outline-light btn-sm" rel="noopener noreferrer">DOCUMENTATION</a>
                            </li>
                            <li class="nav-item">
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-light btn-sm w-100">LOGOUT</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>


            <!-- Contenuto specifico della pagina -->
            <th:block th:replace="${pageContent}"></th:block>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Script specifici della pagina -->
        <th:block th:replace="${pageScripts}"></th:block>

    </body>
</html>
