<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{components/layout :: layout('Invoices - Documentation', ~{::content}, ~{}, ~{::pageScripts})}">

    <body>
        <th:block th:fragment="content">

            <!-- Titolo pagina -->
            <h2 class="text-center" style="margin-bottom: 3rem;">
                <span class="d-inline-block px-4 py-2 border border-dark rounded fs-1">KPI DOCUMENTATION</span>
            </h2>
            <!-- / Titolo pagina -->

            <!-- Messaggio di errore -->
            <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}"></span>
            </div>
            <!-- / Messaggio di errore -->

            <!-- Messaggio di successo -->
            <div th:if="${successMessage != null}" class="alert alert-success" role="alert">
                <span th:text="${successMessage}"></span>
            </div>
            <!-- / Messaggio di successo -->

            <!-- Ricerca -->
            <div class="card mb-4 border-0">
                <div class="card-body">
                    <form th:action="@{/documentation}" method="get" class="row g-3 align-items-end">

                        <!-- Campi di ricerca -->
                        <div class="col-md-3">
                            <label class="form-label fw-bold" for="controlId">Control ID</label>
                            <input class="form-control" id="controlId" type="text" name="controlId" th:value="${controlId}" placeholder="es. RA-QA-02">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold" for="kpiId">KPI ID</label>
                            <input class="form-control" id="kpiId" type="text" name="kpiId" th:value="${kpiId}" placeholder="es. KPI_48">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold" for="field">Field</label>
                            <select class="form-select" id="field" name="field">
                                <option value="">-- Tutti i campi --</option>
                                <option th:each="f : ${fieldEnums}"
                                        th:value="${f.value}"
                                        th:text="${f.value}"
                                        th:selected="${field != null and field == f.value}">

                                </option>
                            </select>
                        </div>
                        <!--/Campi di ricerca -->

                        <!-- Pulsanti -->
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-search me-1"></i>SEARCH
                            </button>

                            <a th:href="@{/documentation}" class="btn btn-outline-secondary flex-grow-1">
                                <i class="bi bi-x-lg me-1"></i>CLEAR
                            </a>

                            <button type="button" class="btn btn-success flex-grow-1" data-bs-toggle="modal" data-bs-target="#documentationModal">
                                <i class="bi bi-plus-lg me-1"></i>NEW
                            </button>

                        </div>
                        <!-- / Pulsanti -->

                    </form>
                </div>
            </div>
            <!-- / Ricerca -->

            <!-- Modale per inserimento nuova documentazione -->
            <div class="modal fade" id="documentationModal" tabindex="-1" aria-labelledby="documentationModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <!-- Header della modale -->
                        <div class="modal-header">
                            <h5 class="modal-title" id="documentationModalLabel"> NEW KPI DOCUMENTATION </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
                        </div>

                        <form th:action="@{/documentation}" method="post">

                            <!-- Body della modale -->
                            <div class="modal-body">

                                <div class="mb-3">
                                    <label for="newKpiId" class="form-label fw-bold"> KPI ID </label>
                                    <input type="text" class="form-control" id="newKpiId" name="kpiId" required>
                                </div>

                                <div class="mb-3">
                                    <label for="newControlId" class="form-label fw-bold"> Control ID </label>
                                    <input type="text" class="form-control" id="newControlId" name="controlId" required>
                                </div>

                                <div class="mb-3">
                                    <label for="newTitle" class="form-label fw-bold"> Title </label>
                                    <textarea class="form-control" id="newTitle" name="title" rows="3" required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="newField" class="form-label fw-bold"> Field</label>
                                    <select class="form-select" id="newField" name="field" required>
                                        <option value="">-- Seleziona un campo --</option>
                                        <option th:each="f : ${fieldEnums}" th:value="${f.value}" th:text="${f.value}"></option>
                                    </select>
                                </div>

                            </div>

                            <!-- Footer -->
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"> CANCEL </button>
                                <button type="submit" class="btn btn-primary"> SAVE </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <!-- Modale di conferma eliminazione documentazione -->
            <div class="modal fade" id="deleteDocumentationModal" tabindex="-1" aria-labelledby="deleteDocumentationModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <!-- Header della modale -->
                        <div class="modal-header">
                            <h5 class="modal-title" id="deleteDocumentationModalLabel"> CONFIRM DELETE </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <!-- Body della modale -->
                        <div class="modal-body"> Are you sure you want to delete <strong id="deleteControlId"></strong>?</div>

                        <!-- Footer della modale -->
                        <div class="modal-footer">

                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">CANCEL</button>

                            <form id="deleteDocumentationForm" method="post">
                                <button type="submit" class="btn btn-danger">DELETE </button>
                            </form>

                        </div>

                    </div>
                </div>
            </div>

            <!-- Risultati -->
            <div class="card mb-4 border-0">
                <div class="card-body">
                    <div class="table-responsive">

                        <table class="table table-bordered table-hover align-middle" id="docs">
                            <colgroup>
                                <col style="width: 12%;">
                                <col style="width: 12%;">
                                <col style="width: 12%;">
                                <col style="width: 40%;">
                                <col style="width: 12%;">
                                <col style="width: 12%;">
                            </colgroup>

                            <thead class="table-primary">
                            <tr>
                                <th>CONTROL ID</th>
                                <th>KPI ID</th>
                                <th>FIELD</th>
                                <th>DESCRIPTION</th>
                                <th class="text-center">DOCUMENTATION</th>
                                <th class="text-center">DELETE</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${results}">
                                <td th:text="${row.controlId}"></td>
                                <td th:text="${row.kpiId}"></td>
                                <td th:text="${row.field}"></td>
                                <td th:text="${row.title}"></td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center align-items-center gap-2">
                                        <a th:href="@{/KPI_01_Skylogic_02-09-2026.pdf}" target="_blank" rel="noopener noreferrer" title="KPI_01_Skylogic_02-09-2026.pdf"
                                           class="text-decoration-none d-inline-flex align-items-center">
                                            <i class="bi bi-file-earmark-pdf fs-4"></i>
                                        </a>
                                    </div>
                                </td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center align-items-center gap-2">
                                        <button type="button" class="btn p-0 border-0 text-danger d-inline-flex align-items-center" data-bs-toggle="modal" data-bs-target="#deleteDocumentationModal"
                                                th:attr="data-id=${row.id}, data-control-id=${row.controlId}" th:title="'Delete ' + ${row.controlId}">
                                            <i class="bi bi-trash fs-4"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${kpiId != null or controlId != null or (field != null and !#strings.isEmpty(field))}">
                                <td th:if="${results == null or #lists.isEmpty(results)}" colspan="5" class="text-center text-muted">Nessun risultato trovato</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- / Risultati -->

        </th:block>

        <th:block th:fragment="pageScripts">
            <!-- Javascript -->
            <script>
                const deleteModal = document.getElementById('deleteDocumentationModal');

                deleteModal.addEventListener('show.bs.modal', function (event) {

                    // Pulsante DELETE della riga che ha aperto il modal.
                    const button = event.relatedTarget;

                    // Dati della documentazione selezionata.
                    const id = button.getAttribute('data-id');
                    const controlId = button.getAttribute('data-control-id');

                    // Mostra il Control ID nel messaggio di conferma.
                    document.getElementById('deleteControlId').textContent = controlId;

                    // Imposta dinamicamente l'endpoint di cancellazione.
                    document.getElementById('deleteDocumentationForm').action = '/documentation/' + id + '/delete';

                });
            </script>
            <!-- / Javascript -->
        </th:block>
    </body>
</html>
